server:
  port: 8081

spring:
  application:
    name: product-service

  # Spring 接收 multipart 文件时的大小限制
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
    # 商品服务连接本机 Docker 中的 MySQL
  datasource:
    url: jdbc:mysql://127.0.0.1:13380/pinshengsheng?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_ROOT_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        ip: 127.0.0.1

management:
  endpoints:
    web:
      exposure:
        include: health,info

info:
  app:
    name: pinshengsheng-product-service
    description: 拼省省商品服务
# MyBatis-Plus 开发配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
# 商品图片存储配置；密钥只从本机环境变量读取
minio:
  endpoint: http://127.0.0.1:9000
  access-key: ${MINIO_ROOT_USER}
  secret-key: ${MINIO_ROOT_PASSWORD}
  bucket-name: pinshengsheng-product