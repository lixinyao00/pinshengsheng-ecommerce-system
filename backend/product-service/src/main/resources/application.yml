server:
  port: 8381

spring:
  # 开发环境从仓库外的 infra/.env 读取本地密码，不把密码写进 Git
  config:
    import: optional:file:../../infra/.env[.properties]
  application:
    name: product-service

  # Spring 接收 multipart 文件时的大小限制
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  # 开发环境中执行 schema.sql，自动补齐新增业务表
  sql:
    init:
      mode: always

  # 商品服务连接本机 Docker 中的 MySQL
  datasource:
    url: jdbc:mysql://127.0.0.1:13380/pinshengsheng?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: ${PSS_MYSQL_PASSWORD:pinshengsheng_root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 16379
      timeout: 3s
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:18848
        ip: 127.0.0.1

management:
  endpoints:
    web:
      exposure:
        include: health,info

info:
  app:
    name: pinshengsheng-product-service
    description: 拼省省商品服务
# MyBatis-Plus 开发配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
# 商品图片存储配置；密钥只从本机环境变量读取
minio:
  endpoint: http://127.0.0.1:9000
  access-key: ${MINIO_ROOT_USER}
  secret-key: ${MINIO_ROOT_PASSWORD}
  bucket-name: pinshengsheng-product
