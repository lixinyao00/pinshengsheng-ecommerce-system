server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        ip: 127.0.0.1
    gateway:
      routes:
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/product/**
        # 将认证相关请求转发到 auth-service
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
        # 后台商品管理请求转发到商品服务
        - id: product-admin-service
          uri: lb://product-service
          predicates:
            - Path=/api/admin/**
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
