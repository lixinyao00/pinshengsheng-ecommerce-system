server:
  port: 8384

order:
  timeout-minutes: 30
  timeout-check-delay-ms: 60000

spring:
  # 开发环境读取仓库外的本地密码
  config:
    import: optional:file:../../infra/.env[.properties]
  application:
    name: order-service
  product-service:
    url: ${PSS_PRODUCT_SERVICE_URL:http://127.0.0.1:8381}
  datasource:
    url: jdbc:mysql://${PSS_MYSQL_HOST:127.0.0.1}:${PSS_MYSQL_PORT:13380}/pinshengsheng?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${PSS_MYSQL_PASSWORD:pinshengsheng_root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  rabbitmq:
    host: ${PSS_RABBITMQ_HOST:127.0.0.1}
    port: ${PSS_RABBITMQ_PORT:5672}
    username: ${PSS_RABBITMQ_USERNAME:pinshengsheng}
    password: ${PSS_RABBITMQ_PASSWORD:pinshengsheng_rabbit_change_me}
  sql:
    init:
      mode: always
  cloud:
    nacos:
      discovery:
        server-addr: ${PSS_NACOS_HOST:127.0.0.1}:${PSS_NACOS_PORT:18848}

management:
  endpoints:
    web:
      exposure:
        include: health,info

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
