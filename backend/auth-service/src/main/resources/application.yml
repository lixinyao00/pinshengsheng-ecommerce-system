server:
  port: 8082

spring:
  application:
    name: auth-service
  data:
    redis:
      host: 127.0.0.1
      port: 16379
      timeout: 3s
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:18848
        ip: 127.0.0.1

management:
  endpoints:
    web:
      exposure:
        include: health,info
