server:
  port: 8382

spring:
  config:
    import: optional:file:../../infra/.env[.properties]
  application:
    name: auth-service
  sql:
    init:
      mode: always
  datasource:
    url: jdbc:mysql://${PSS_MYSQL_HOST:127.0.0.1}:${PSS_MYSQL_PORT:13380}/pinshengsheng?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: ${PSS_MYSQL_PASSWORD:pinshengsheng_root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${PSS_REDIS_HOST:127.0.0.1}
      port: ${PSS_REDIS_PORT:16379}
      timeout: 3s
  cloud:
    nacos:
      discovery:
        server-addr: ${PSS_NACOS_HOST:127.0.0.1}:${PSS_NACOS_PORT:18848}

management:
  endpoints:
    web:
      exposure:
        include: health,info
