services:
  mysql:
    image: mysql:8.0.36
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.0.10
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  nacos:
    image: nacos/nacos-server:v2.2.3
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 384m
      JVM_XMN: 128m
      TZ: Asia/Shanghai

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${PSS_RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${PSS_RABBITMQ_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  gateway-service:
    build:
      context: ../backend
      args:
        JAR_FILE: gateway-service/target/gateway-service-0.0.1-SNAPSHOT.jar
    restart: unless-stopped
    environment: &app-environment
      PSS_NACOS_HOST: nacos
      PSS_NACOS_PORT: 8848
      PSS_MYSQL_HOST: mysql
      PSS_MYSQL_PORT: 3306
      PSS_REDIS_HOST: redis
      PSS_REDIS_PORT: 6379
      PSS_RABBITMQ_HOST: rabbitmq
      PSS_RABBITMQ_PORT: 5672
      PSS_RABBITMQ_USERNAME: ${PSS_RABBITMQ_USERNAME}
      PSS_RABBITMQ_PASSWORD: ${PSS_RABBITMQ_PASSWORD}
      PSS_MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      PSS_MINIO_ENDPOINT: http://minio:9000
      PSS_MINIO_PUBLIC_ENDPOINT: ${PSS_MINIO_PUBLIC_ENDPOINT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      PSS_PRODUCT_SERVICE_URL: http://product-service:8381
      JAVA_OPTS: -Xms128m -Xmx256m
    depends_on:
      - nacos

  auth-service:
    build:
      context: ../backend
      args:
        JAR_FILE: auth-service/target/auth-service-0.0.1-SNAPSHOT.jar
    restart: unless-stopped
    environment:
      <<: *app-environment
      JAVA_OPTS: -Xms128m -Xmx256m
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_started

  product-service:
    build:
      context: ../backend
      args:
        JAR_FILE: product-service/target/product-service-0.0.1-SNAPSHOT.jar
    restart: unless-stopped
    environment:
      <<: *app-environment
      JAVA_OPTS: -Xms128m -Xmx384m
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_started
      minio:
        condition: service_started

  cart-service:
    build:
      context: ../backend
      args:
        JAR_FILE: cart-service/target/cart-service-0.0.1-SNAPSHOT.jar
    restart: unless-stopped
    environment:
      <<: *app-environment
      JAVA_OPTS: -Xms128m -Xmx256m
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_started

  order-service:
    build:
      context: ../backend
      args:
        JAR_FILE: order-service/target/order-service-0.0.1-SNAPSHOT.jar
    restart: unless-stopped
    environment:
      <<: *app-environment
      JAVA_OPTS: -Xms128m -Xmx384m
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_started

  nginx:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - gateway-service
      - minio

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  minio-data:
